<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>Oryzen Technolabs — Offline</title>
    <style>
      :root {
        color: #111111;
        background: #f4f3ee;
        font-family: "Helvetica Neue", Inter, ui-sans-serif, system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        border: 1px solid rgba(17, 17, 17, 0.12);
        border-radius: 32px;
        background: rgba(255, 255, 255, 0.7);
        padding: 32px;
        box-shadow: 0 30px 90px -70px rgba(17, 17, 17, 0.7);
      }
      img {
        width: 168px;
        height: 52px;
        object-fit: cover;
        border-radius: 999px;
        border: 1px solid rgba(17, 17, 17, 0.12);
      }
      h1 {
        margin: 32px 0 12px;
        font-size: clamp(2.25rem, 8vw, 4rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }
      p {
        margin: 0;
        color: rgba(17, 17, 17, 0.62);
        line-height: 1.7;
      }
      a {
        display: inline-flex;
        margin-top: 24px;
        border-radius: 999px;
        background: #111111;
        color: #f4f3ee;
        padding: 12px 18px;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="Oryzen Technolabs logo" />
      <h1>You are offline.</h1>
      <p>The portfolio shell is available offline. Reconnect to load live project links, external logos, and fresh content.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
